<!doctype html>
<html lang="ta">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>திருக்குர்ஆன் · Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #ece7dc;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 30rem; padding: 2rem; }
      h1 { font-size: 1.5rem; font-weight: 500; }
      p { color: #8a8378; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>இணைய இணைப்பு இல்லை</h1>
      <p>ஏற்கனவே திறந்த பக்கங்களை இணைய இணைப்பு இல்லாமலும் வாசிக்கலாம்.</p>
    </main>
  </body>
</html>
